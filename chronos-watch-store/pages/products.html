<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Timepieces</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #2a2a2a;
            --accent: #c4a777;
            --light: #fff;
            --text: #333;
            --gray: #f5f5f5;
            --gold: #c4a777;
            --dark-gold: #a88a5c;
            --black: #1a1a1a;
        }

        body {
            padding-top: 60px;
        }

        /* Header Styles */
        header {
            background: var(--primary);
            color: var(--light);
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            z-index: 1000;
            top: 0;
            left: 0;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--light);
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* Product Styles */
        .product-card {
            background: white;
            border: none;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            position: relative;
            height: 100%;
        }

        .product-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 30px rgba(0,0,0,0.15);
        }

        .product-image-container {
            position: relative;
            overflow: hidden;
            height: 300px;
            background: #f8f9fa;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card:hover .product-image {
            transform: scale(1.1);
        }

        .price-tag {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--gold);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            opacity: 0;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(3px);
        }

        .product-card:hover .overlay {
            opacity: 1;
        }

        .quick-view-btn {
            background: white;
            color: var(--black);
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 600;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.4s ease;
            border: none;
            cursor: pointer;
        }

        .quick-view-btn:hover {
            background: var(--gold);
            color: white;
        }

        .product-card:hover .quick-view-btn {
            transform: translateY(0);
            opacity: 1;
        }

        .product-info {
            padding: 25px;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--black);
        }

        .product-description {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .add-to-cart-btn {
            background: var(--gold);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .add-to-cart-btn:hover {
            background: var(--dark-gold);
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
        }
        .product-card:hover .quick-view-btn {
            transform: translateY(0);
            opacity: 1;
        }

        .cart-popup {
            position: fixed;
            top: 80px;
            right: 20px;
            background: white;
            padding: 1rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            transform: translateX(150%);
            transition: transform 0.3s ease-out;
        }

        .cart-popup.show {
            transform: translateX(0);
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="index.html" class="logo">CHRONOS</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="blog.html">Blog</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>
    <div class="container py-5">
        <h2 class="section-title display-4 mb-5">Luxury Timepieces</h2>
        
        <div class="row g-4" id="products-container">
            <!-- Products will be inserted here by JavaScript -->
        </div>
    </div>

    <script>
        // Product data
        const products = [
            {
                name: "G-Shock Rainbow Brick Wall",
                price: "$120",
                image: "https://cdn.shopify.com/s/files/1/0074/5432/6835/files/g-shock-dw5600-rainbow-brick-wall-digital-black-dw-5600rw-1-523081.jpg",
                description: "Digital watch with rainbow brick wall pattern and robust features"
            },
            {
                name: "G-Shock Mudmaster",
                price: "$400",
                image: "https://cdn.shopify.com/s/files/1/0074/5432/6835/files/g-shock-gw9500-mudmaster-master-of-g-digital-black-gw-9500mec-1-461314.jpg",
                description: "Professional-grade digital watch with multiple sensors"
            },
            {
                name: "G-Shock GM2100 Rainbow",
                price: "$220",
                image: "https://cdn.shopify.com/s/files/1/0074/5432/6835/files/g-shock-gm2100-rainbow-brick-wall-ana-digi-black-silver-gm-2100-rw-1a-743773.jpg",
                description: "Ana-digi combination with rainbow accent design"
            },
            {
                name: "Olto-8 Shot Skeleton",
                price: "$400",
                image: "https://cdn.shopify.com/s/files/1/0074/5432/6835/files/olto-8-shot-skeleton-automatic-red-v3-1031-s14-622783.jpg",
                description: "Skeleton automatic watch with unique design"
            },
            {
                name: "Olto-8 Coral Steward",
                price: "$399",
                image: "https://cdn.shopify.com/s/files/1/0074/5432/6835/files/olto-8-coral-steward-diving-automatic-retro-green-o4-2282-s08-230357.jpg",
                description: "Diving watch with vintage-inspired design"
            },
            {
                name: "G-Shock GM700 G-Steel",
                price: "$240",
                image: "https://cdn.shopify.com/s/files/1/0074/5432/6835/files/g-shock-gm700-g-steel-ana-digi-purple-gm-700p-6a-850240.jpg",
                description: "G-Steel series with purple accents"
            },
            {
                name: "G-Shock Metal Navy",
                price: "$300",
                image: "https://cdn.shopify.com/s/files/1/0074/5432/6835/files/g-shock-gm2110d-metal-ana-digi-navy-gm-2110d-2b-798031.jpg",
                description: "Metal bezel G-Shock with navy blue accents"
            },
            {
                name: "G-Shock Metal Green",
                price: "$300",
                image: "https://cdn.shopify.com/s/files/1/0074/5432/6835/files/g-shock-gm2110d-metal-ana-digi-green-gm-2110d-3a-412436.jpg",
                description: "Metal bezel G-Shock with green accents"
            },
            {
                name: "Duxot Atlantica Blue",
                price: "$279",
                image: "https://cdn.shopify.com/s/files/1/0074/5432/6835/files/duxot-atlantica-diver-automatic-deep-blue-dx-2057-44-155477.jpg",
                description: "Professional diver watch with blue dial"
            },
            {
                name: "Duxot Atlantica Brown",
                price: "$279",
                image: "https://cdn.shopify.com/s/files/1/0074/5432/6835/files/duxot-atlantica-diver-automatic-chocolate-brown-dx-2057-99-725813.jpg",
                description: "Elegant diver watch with brown dial"
            }
        ];

        // Function to create product cards
        function createProductCards() {
            const container = document.getElementById('products-container');
            container.innerHTML = ''; // Clear existing content
            
            products.forEach((product, index) => {
                const delay = index * 0.1;
                const productHTML = `
                    <div class="col-lg-3 col-md-6" style="animation-delay: ${delay}s">
                        <div class="product-card">
                            <div class="product-image-container">
                                <span class="price-tag">${product.price}</span>
                                <img 
                                    src="${product.image}" 
                                    alt="${product.name}" 
                                    class="product-image"
                                    onerror="this.src='/api/placeholder/400/300'"
                                >
                                <div class="overlay">
                                    <button class="quick-view-btn">Quick View</button>
                                </div>
                            </div>
                            <div class="product-info">
                                <h3 class="product-title">${product.name}</h3>
                                <p class="product-description">${product.description}</p>
                                <button class="add-to-cart-btn" onclick="addToCart(${index})">
                                    <i class="fas fa-shopping-cart"></i>
                                    Add to Cart
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += productHTML;
            });
        }

        // Function to add item to cart
        function addToCart(productIndex) {
            const product = products[productIndex];
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push(product);
            localStorage.setItem('cart', JSON.stringify(cart));
            
            // Show popup notification
            showCartPopup();
        }

        // Function to show cart popup
        function showCartPopup() {
            const existingPopup = document.querySelector('.cart-popup');
            if (existingPopup) {
                existingPopup.remove();
            }

            const popup = document.createElement('div');
            popup.className = 'cart-popup';
            popup.innerHTML = `
                <div class="d-flex align-items-center gap-2">
                    <i class="fas fa-check-circle text-success"></i>
                    <span>Item added to cart! <a href="checkout.html" class="text-primary">View Cart</a></span>
                </div>
            `;
            document.body.appendChild(popup);
            
            // Trigger reflow before adding show class
            popup.offsetHeight;
            popup.classList.add('show');
            
            setTimeout(() => {
                popup.classList.remove('show');
                setTimeout(() => {
                    popup.remove();
                }, 300);
            }, 3000);
        }

        // Initialize when the page loads
        document.addEventListener('DOMContentLoaded', createProductCards);
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
