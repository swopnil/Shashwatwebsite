<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos - Watch Blog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #1a1a1a;
            --secondary: #2a2a2a;
            --accent: #c4a777;
            --light: #fff;
            --text: #333;
            --gray: #f5f5f5;
        }

        body {
            line-height: 1.6;
            padding-top: 60px;
        }

        /* Header Styles */
        header {
            background: var(--primary);
            color: var(--light);
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            z-index: 1000;
            top: 0;
            left: 0;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--light);
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* Blog Header */
        .blog-header {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
                        url('/api/placeholder/1920/600') center/cover;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--light);
            text-align: center;
        }

        .blog-header h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: fadeIn 1s ease-out;
        }

        .blog-header p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
            animation: fadeIn 1.2s ease-out;
        }

        /* Blog Grid */
        .blog-container {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .blog-card {
            background: var(--light);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            animation: fadeIn 0.5s ease-out;
        }

        .blog-card:hover {
            transform: translateY(-10px);
        }

        .blog-image {
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .blog-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .blog-card:hover .blog-image img {
            transform: scale(1.1);
        }

        .blog-content {
            padding: 1.5rem;
        }

        .blog-content h2 {
            color: var(--text);
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .blog-content p {
            color: #666;
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .blog-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #888;
            font-size: 0.9rem;
        }

        .read-more {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s;
        }

        .read-more:hover {
            color: #b39265;
        }

        /* Hamburger Menu */
        .hamburger {
            display: none;
            background: none;
            border: none;
            color: var(--light);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hamburger {
                display: block;
            }

            .nav-links {
                position: fixed;
                top: 60px;
                left: 0;
                right: 0;
                background: var(--primary);
                padding: 1rem;
                flex-direction: column;
                align-items: center;
                display: none;
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links a {
                padding: 0.5rem 0;
            }

            .blog-header h1 {
                font-size: 2rem;
            }

            .blog-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">CHRONOS</a>
            <button class="hamburger">
                <i class="fas fa-bars"></i>
            </button>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="blog.html">Blog</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <section class="blog-header">
        <div class="header-content">
            <h1>Watch Industry Insights</h1>
            <p>Discover the latest trends, technological advancements, and stories from the world of luxury timepieces</p>
        </div>
    </section>

    <main class="blog-container">
        <div class="blog-grid" id="blogGrid">
            <!-- Blog posts will be dynamically populated -->
        </div>
    </main>

    <script>
        // Mobile Navigation
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');

        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!hamburger.contains(e.target) && !navLinks.contains(e.target)) {
                navLinks.classList.remove('active');
            }
        });

        // Blog Posts Data
        const blogPosts = [
            {
                title: "The Evolution of Smartwatches",
                excerpt: "Explore how traditional watchmaking meets modern technology in the era of smart timepieces...",
                image: "/api/placeholder/600/400",
                author: "James Wilson",
                date: "January 9, 2025",
                readTime: "5 min read"
            },
            {
                title: "Sustainable Practices in Watch Manufacturing",
                excerpt: "Discover how luxury watch brands are adopting eco-friendly practices while maintaining quality...",
                image: "/api/placeholder/600/400",
                author: "Sarah Chen",
                date: "January 8, 2025",
                readTime: "4 min read"
            },
            {
                title: "The Art of Watch Movement",
                excerpt: "Understanding the intricate mechanics behind luxury timepieces and their precise movements...",
                image: "/api/placeholder/600/400",
                author: "Michael Brown",
                date: "January 7, 2025",
                readTime: "6 min read"
            }
        ];

        // Populate blog posts
        const blogGrid = document.getElementById('blogGrid');
        blogPosts.forEach(post => {
            const blogCard = document.createElement('article');
            blogCard.className = 'blog-card';
            blogCard.innerHTML = `
                <div class="blog-image">
                    <img src="${post.image}" alt="${post.title}">
                </div>
                <div class="blog-content">
                    <h2>${post.title}</h2>
                    <p>${post.excerpt}</p>
                    <div class="blog-meta">
                        <span>${post.date} · ${post.readTime}</span>
                        <a href="#" class="read-more">
                            Read More
                            <i class="fas fa-arrow-right"></i>
                        </a>
                    </div>
                </div>
            `;
            blogGrid.appendChild(blogCard);
        });
    </script>
</body>
</html>
