<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos - Luxury Watch Store</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --gold: #c4a777;
            --dark-gold: #a88a5c;
            --black: #1a1a1a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Header & Navigation */
        .navbar {
            background-color: var(--black);
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .navbar-brand {
            color: var(--gold);
            font-size: 1.8rem;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .navbar-brand:hover {
            color: var(--dark-gold);
        }

        .nav-link {
            color: white !important;
            font-weight: 500;
            padding: 0.5rem 1rem !important;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: var(--gold) !important;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('/api/placeholder/1920/1080');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding-top: 76px;
        }

        .hero-content {
            max-width: 800px;
            padding: 2rem;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            animation: fadeInDown 1s ease;
        }

        .hero-text {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            animation: fadeInUp 1s ease 0.3s;
            animation-fill-mode: both;
        }

        /* Product Card Styles */
        .product-card {
            background: white;
            border: none;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.15);
        }

        .product-image-container {
            position: relative;
            overflow: hidden;
            height: 300px;
            background: #f8f9fa;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.1);
        }

        .price-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--gold);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-card:hover .overlay {
            opacity: 1;
        }

        .quick-view-btn {
            background: white;
            color: var(--black);
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 600;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .product-card:hover .quick-view-btn {
            transform: translateY(0);
            opacity: 1;
        }

        .quick-view-btn:hover {
            background: var(--gold);
            color: white;
        }

        .product-info {
            padding: 25px;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--black);
        }

        .product-description {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .add-to-cart-btn {
            background: var(--gold);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }

        .add-to-cart-btn:hover {
            background: var(--dark-gold);
            transform: translateY(-2px);
        }

        .view-more-btn {
            display: inline-block;
            background: var(--gold);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .view-more-btn:hover {
            background: var(--dark-gold);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            color: white;
            text-decoration: none;
        }

        /* Section Styling */
        .section-title {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
            padding-bottom: 20px;
        }

        .section-title:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: var(--gold);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-card {
            animation: fadeInUp 0.6s ease forwards;
        }

    
.product-card {
    height: 100%;
    margin-bottom: 40px;  /* Increased bottom margin */
}

.product-image-container {
    height: 350px;  /* Made images taller */
}

.product-title {
    font-size: 1.3rem;  /* Larger title */
}

.product-description {
    font-size: 1rem;  /* Slightly larger description */
}

/* Update animation delays for 3 items */
.product-card:nth-child(1) { animation-delay: 0.1s; }
.product-card:nth-child(2) { animation-delay: 0.2s; }
.product-card:nth-child(3) { animation-delay: 0.3s; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }
            .navbar-brand {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">CHRONOS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="blog.html">Blog</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Timeless Elegance</h1>
            <p class="hero-text">Discover our exclusive collection of luxury timepieces that blend sophistication with precision.</p>
            <a href="products.html" class="view-more-btn">Explore Collection</a>
        </div>
    </section>

    <!-- Featured Products Section -->
    <section class="container py-5">
        <h2 class="section-title display-4 mb-5">Featured Collection</h2>
        <div class="row" id="featured-products">
            <!-- Products will be inserted here by JavaScript -->
        </div>
        <div class="text-center mt-5">
            <a href="products.html" class="view-more-btn">
                View More Products
            </a>
        </div>
    </section>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <!-- Products Script -->
<!-- Replace the existing Products Script section with this: -->
<script>
    const featuredProducts = [
        {
            name: "G-Shock Rainbow Brick Wall",
            price: "$120",
            image: "https://cdn.shopify.com/s/files/1/0074/5432/6835/files/g-shock-dw5600-rainbow-brick-wall-digital-black-dw-5600rw-1-523081.jpg",
            description: "Digital watch with rainbow brick wall pattern and robust features"
        },
        {
            name: "G-Shock Mudmaster",
            price: "$400",
            image: "https://cdn.shopify.com/s/files/1/0074/5432/6835/files/g-shock-gw9500-mudmaster-master-of-g-digital-black-gw-9500mec-1-461314.jpg",
            description: "Professional-grade digital watch with multiple sensors"
        },
        {
            name: "G-Shock GM2100 Rainbow",
            price: "$220",
            image: "https://cdn.shopify.com/s/files/1/0074/5432/6835/files/g-shock-gm2100-rainbow-brick-wall-ana-digi-black-silver-gm-2100-rw-1a-743773.jpg",
            description: "Ana-digi combination with rainbow accent design"
        }
    ];

    // Get the products container element first
    const productsContainer = document.getElementById('featured-products');

    // Then populate featured products
    productsContainer.innerHTML = featuredProducts.map((product, index) => `
        <div class="col-lg-4 col-md-6">
            <div class="product-card">
                <div class="product-image-container">
                    <span class="price-badge">${product.price}</span>
                    <img src="${product.image}" alt="${product.name}" class="product-image">
                    <div class="overlay">
                        <button class="quick-view-btn" onclick="showQuickView('${product.name}')">Quick View</button>
                    </div>
                </div>
                <div class="product-info">
                    <h3 class="product-title">${product.name}</h3>
                    <p class="product-description">${product.description}</p>
                    <button class="add-to-cart-btn" onclick="addToCart('${product.name}')">
                        <i class="fas fa-shopping-cart"></i>
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>
    `).join('');

    // Navbar scroll effect
    window.addEventListener('scroll', () => {
        const navbar = document.querySelector('.navbar');
        if (window.scrollY > 50) {
            navbar.style.padding = '0.5rem 0';
            navbar.style.backgroundColor = 'rgba(26, 26, 26, 0.95)';
        } else {
            navbar.style.padding = '1rem 0';
            navbar.style.backgroundColor = 'var(--black)';
        }
    });

    // Quick View function
    function showQuickView(productName) {
        alert(`Quick View for ${productName} - Feature coming soon!`);
    }

    // Add to Cart function
    function addToCart(productName) {
        alert(`${productName} added to cart! - Feature coming soon!`);
    }
</script></body>
</html>
