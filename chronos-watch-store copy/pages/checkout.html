<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONOS - Checkout</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #2a2a2a;
            --accent: #c4a777;
            --light: #fff;
            --text: #333;
            --gray: #f5f5f5;
            --gold: #c4a777;
            --dark-gold: #a88a5c;
            --black: #1a1a1a;
        }

        body {
            padding-top: 60px;
            background-color: var(--gray);
        }

        header {
            background: var(--primary);
            color: var(--light);
            padding: 0 0;
            position: fixed;
            width: 100%;
            z-index: 1000;
            top: 0;
            left: 0;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--light);
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .checkout-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .cart-item {
            background: white;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
        }

        .cart-item-details {
            flex-grow: 1;
        }

        .remove-item {
            color: #dc3545;
            cursor: pointer;
            transition: color 0.3s;
        }

        .remove-item:hover {
            color: #c82333;
        }

        .order-summary {
            background: white;
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .payment-methods {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .payment-method {
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .payment-method.selected {
            border-color: var(--gold);
            background-color: #fff9f0;
        }

        .payment-method img {
            height: 30px;
            object-fit: contain;
        }

        .checkout-btn {
            background: var(--gold);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 25px;
            width: 100%;
            font-weight: 600;
            transition: background 0.3s;
        }

        .checkout-btn:hover {
            background: var(--dark-gold);
        }

        .cart-popup {
            position: fixed;
            top: 80px;
            right: 20px;
            background: white;
            padding: 1rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            transform: translateX(150%);
            transition: transform 0.3s ease-out;
        }

        .cart-popup.show {
            transform: translateX(0);
        }

        .form-control:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 0.25rem rgba(196, 167, 119, 0.25);
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">CHRONOS</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="blog.html">Blog</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <div class="cart-popup" id="cartPopup">
        <div class="d-flex align-items-center gap-2">
            <i class="fas fa-check-circle text-success"></i>
            <span>Item added to cart!</span>
        </div>
    </div>

    <div class="checkout-container">
        <div class="row g-4">
            <div class="col-lg-8">
                <h2 class="mb-4">Shopping Cart</h2>
                <div id="cartItems">
                    <!-- Cart items will be dynamically added here -->
                </div>

                <h2 class="mb-4 mt-5">Shipping Information</h2>
                <form id="shippingForm" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">City</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">State</label>
                        <select class="form-select" required>
                            <option value="">Choose...</option>
                            <option>CA</option>
                            <option>NY</option>
                            <option>TX</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">ZIP</label>
                        <input type="text" class="form-control" required>
                    </div>
                </form>
            </div>

            <div class="col-lg-4">
                <div class="order-summary">
                    <h3 class="mb-4">Order Summary</h3>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Shipping</span>
                        <span>$9.99</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Tax</span>
                        <span id="tax">$0.00</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4">
                        <strong>Total</strong>
                        <strong id="total">$0.00</strong>
                    </div>

                    <h4 class="mb-3">Payment Method</h4>
                    <div class="payment-methods mb-4">
                        <div class="payment-method selected">
                            <img src="/api/placeholder/60/40" alt="Credit Card">
                        </div>
                        <div class="payment-method">
                            <img src="/api/placeholder/60/40" alt="PayPal">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Card Number</label>
                        <input type="text" class="form-control" placeholder="**** **** **** ****">
                        
                        <div class="row mt-3">
                            <div class="col-6">
                                <label class="form-label">Expiry</label>
                                <input type="text" class="form-control" placeholder="MM/YY">
                            </div>
                            <div class="col-6">
                                <label class="form-label">CVV</label>
                                <input type="text" class="form-control" placeholder="***">
                            </div>
                        </div>
                    </div>

                    <button class="checkout-btn">
                        Complete Order
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize cart from localStorage or empty array
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        
        // Function to show cart popup
        function showCartPopup() {
            const popup = document.getElementById('cartPopup');
            popup.classList.add('show');
            setTimeout(() => {
                popup.classList.remove('show');
            }, 3000);
        }

        // Function to update cart display
        function updateCartDisplay() {
            const cartItems = document.getElementById('cartItems');
            const subtotalElement = document.getElementById('subtotal');
            const taxElement = document.getElementById('tax');
            const totalElement = document.getElementById('total');
            
            cartItems.innerHTML = '';
            let subtotal = 0;

            cart.forEach((item, index) => {
                subtotal += parseFloat(item.price.replace('$', ''));
                
                const itemElement = document.createElement('div');
                itemElement.className = 'cart-item';
                itemElement.innerHTML = `
                    <img src="${item.image}" alt="${item.name}" onerror="this.src='/api/placeholder/100/100'">
                    <div class="cart-item-details">
                        <h5 class="mb-1">${item.name}</h5>
                        <p class="mb-1">${item.price}</p>
                        <small class="text-muted">${item.description}</small>
                    </div>
                    <i class="fas fa-times remove-item" onclick="removeItem(${index})"></i>
                `;
                cartItems.appendChild(itemElement);
            });

            const tax = subtotal * 0.08;
            const total = subtotal + tax + 9.99;

            subtotalElement.textContent = `$${subtotal.toFixed(2)}`;
            taxElement.textContent = `$${tax.toFixed(2)}`;
            totalElement.textContent = `$${total.toFixed(2)}`;
        }

        // Function to remove item from cart
        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartDisplay();
        }

        // Initialize payment method selection
        document.querySelectorAll('.payment-method').forEach(method => {
            method.addEventListener('click', () => {
                document.querySelectorAll('.payment-method').forEach(m => m.classList.remove('selected'));
                method.classList.add('selected');
            });
        });

        // Initialize cart display
        document.addEventListener('DOMContentLoaded', updateCartDisplay);

        // Listen for cart updates from products page
        window.addEventListener('storage', (e) => {
            if (e.key === 'cart') {
                cart = JSON.parse(e.newValue || '[]');
                updateCartDisplay();
                showCartPopup();
            }
        });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
