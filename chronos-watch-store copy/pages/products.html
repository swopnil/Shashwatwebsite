        body {
            padding-top: 60px;
        }
             .quick-view-btn {
            background: white;
            color: var(--black);
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 600;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.4s ease;
            border: none;
            cursor: pointer;
        }

        .quick-view-btn:hover {
            background: var(--gold);
            color: white;
        }


        /* Header Styles */
        header {
            background: var(--primary);
            color: var(--light);
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            z-index: 1000;
            top: 0;
            left: 0;
        }

       
        /* Product Styles */
        .product-card {
            background: white;
            border: none;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            position: relative;
            height: 100%;
        }

        .product-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 30px rgba(0,0,0,0.15);
        }

        .product-image-container {
            position: relative;
            overflow: hidden;
            height: 300;
            background: #ffffff;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card:hover .product-image {
            transform: scale(1.1);
        }

        .price-tag {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--gold);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            opacity: 0;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(3px);
        }

        .product-card:hover .overlay {
            opacity: 1;
        }

        .quick-view-btn {
            background: white;
            color: var(--black);
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 600;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.4s ease;
            border: none;
            cursor: pointer;
        }

        .quick-view-btn:hover {
            background: var(--gold);
            color: white;
        }

        .product-card:hover .quick-view-btn {
            transform: translateY(0);
            opacity: 1;
        }

        .product-info {
            padding: 25px;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--black);
        }

        .product-description {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .add-to-cart-btn {
            background: var(--gold);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .add-to-cart-btn:hover {
            background: var(--dark-gold);
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
        }
        .product-card:hover .quick-view-btn {
            transform: translateY(0);
            opacity: 1;
        }

        .cart-popup {
            position: fixed;
            top: 80px;
            right: 20px;
            background: white;
            padding: 1rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            transform: translateX(150%);
            transition: transform 0.3s ease-out;
        }

        .cart-popup.show {
            transform: translateX(0);
        }

            document.getElementById('modalTitle').textContent = product.name;
            document.getElementById('modalPrice').textContent = product.price;
            document.getElementById('modalDescription').textContent = product.description;
            document.getElementById('modalFeatures').innerHTML = product.features

                .join('');
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

            document.getElementById('productModal').classList.remove('active');
            document.body.style.overflow = 'auto';

            cart.push(product);
            updateCartCount();
            showCartPopup();
        }

        function addToCartFromModal() {
            const productName = document.getElementById('modalTitle').textContent;
            const product = featuredProducts.find(p => p.name === productName);
            if (product) {
                cart.push(product);
                updateCartCount();
                showCartPopup();
            }
            closeModal();
        }

        function updateCartCount() {
            document.getElementById('cartCount').textContent = cart.length;

        function showCartPopup() {
            const popup = document.getElementById('cartPopup');

            setTimeout(() => {

                } else {

                }
            });

            }

            if (e.target === modal) {
                closeModal();
            }
        });

                                </div>
                            </div>
                            <div class="product-info">
                                <h3 class="product-title">${product.name}</h3>
                                <p class="product-description">${product.description}</p>
                                <button class="add-to-cart-btn" onclick="addToCart(${index})">
                                    <i class="fas fa-shopping-cart"></i>
                                    Add to Cart
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += productHTML;
            });
        }

        // Function to add item to cart
        function addToCart(productIndex) {
            const product = products[productIndex];
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push(product);
            localStorage.setItem('cart', JSON.stringify(cart));
            
            // Show popup notification
            showCartPopup();
        }

        // Function to show cart popup
        function showCartPopup() {
            const existingPopup = document.querySelector('.cart-popup');
            if (existingPopup) {
                existingPopup.remove();
            }

            const popup = document.createElement('div');
            popup.className = 'cart-popup';
            popup.innerHTML = `
                <div class="d-flex align-items-center gap-2">
                    <i class="fas fa-check-circle text-success"></i>
                    <span>Item added to cart! <a href="checkout.html" class="text-primary">View Cart</a></span>
                </div>
            `;
            document.body.appendChild(popup);
            
            // Trigger reflow before adding show class
            popup.offsetHeight;
            popup.classList.add('show');
            
            setTimeout(() => {
                popup.classList.remove('show');
                setTimeout(() => {
                    popup.remove();
                }, 300);
            }, 3000);
        }

        // Initialize when the page loads
        document.addEventListener('DOMContentLoaded', createProductCards);
    </script>

</body>
</html>
